<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" font-family="monospace, sans-serif">

  <!-- Background -->
  <rect width="720" height="500" fill="#0f1117" rx="12"/>

  <!-- Title -->
  <text x="360" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#e2e8f0">How a Rolling Window Works</text>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#94a3b8">window=3  ·  each output = mean of the current + 2 previous rows</text>

  <!-- ── Column headers ── -->
  <text x="80"  y="92" text-anchor="middle" font-size="12" fill="#94a3b8">Row</text>
  <text x="200" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">scrap_rate</text>
  <text x="390" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">Window used</text>
  <text x="590" y="92" text-anchor="middle" font-size="12" fill="#94a3b8">rolling(3).mean()</text>

  <!-- ── Row data ── -->
  <!-- Row colours: NaN rows have a muted tint, complete-window rows highlight -->

  <!-- Helper macro as repeated groups -->
  <!-- Row 0 -->
  <rect x="20"  y="100" width="120" height="36" rx="5" fill="#1e2433"/>
  <rect x="148" y="100" width="104" height="36" rx="5" fill="#1e2433"/>
  <rect x="260" y="100" width="260" height="36" rx="5" fill="#1e2433"/>
  <rect x="528" y="100" width="164" height="36" rx="5" fill="#1e2433"/>
  <text x="80"  y="123" text-anchor="middle" font-size="13" fill="#cbd5e1">0</text>
  <text x="200" y="123" text-anchor="middle" font-size="13" fill="#f1f5f9">0.12</text>
  <text x="390" y="123" text-anchor="middle" font-size="12" fill="#64748b">[0.12] — only 1 row</text>
  <text x="610" y="123" text-anchor="middle" font-size="13" fill="#fbbf24">NaN</text>

  <!-- Row 1 -->
  <rect x="20"  y="142" width="120" height="36" rx="5" fill="#1e2433"/>
  <rect x="148" y="142" width="104" height="36" rx="5" fill="#1e2433"/>
  <rect x="260" y="142" width="260" height="36" rx="5" fill="#1e2433"/>
  <rect x="528" y="142" width="164" height="36" rx="5" fill="#1e2433"/>
  <text x="80"  y="165" text-anchor="middle" font-size="13" fill="#cbd5e1">1</text>
  <text x="200" y="165" text-anchor="middle" font-size="13" fill="#f1f5f9">0.08</text>
  <text x="390" y="165" text-anchor="middle" font-size="12" fill="#64748b">[0.12, 0.08] — only 2 rows</text>
  <text x="610" y="165" text-anchor="middle" font-size="13" fill="#fbbf24">NaN</text>

  <!-- Row 2 — first full window, highlighted -->
  <rect x="20"  y="184" width="120" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="148" y="184" width="104" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="260" y="184" width="260" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="528" y="184" width="164" height="36" rx="5" fill="#1e3a5f"/>
  <!-- window bracket -->
  <rect x="152" y="106" width="96" height="110" rx="4" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="80"  y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd">2</text>
  <text x="200" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd">0.15</text>
  <text x="390" y="207" text-anchor="middle" font-size="12" fill="#93c5fd">[0.12, 0.08, 0.15] ← full!</text>
  <text x="610" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#4ade80">(0.12+0.08+0.15)/3 = 0.117</text>

  <!-- Row 3 — window slides -->
  <rect x="20"  y="226" width="120" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="148" y="226" width="104" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="260" y="226" width="260" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="528" y="226" width="164" height="36" rx="5" fill="#1e3a5f"/>
  <!-- window bracket -->
  <rect x="152" y="148" width="96" height="110" rx="4" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="80"  y="249" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd">3</text>
  <text x="200" y="249" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd">0.09</text>
  <text x="390" y="249" text-anchor="middle" font-size="12" fill="#93c5fd">[0.08, 0.15, 0.09] ← slid down</text>
  <text x="610" y="249" text-anchor="middle" font-size="13" font-weight="bold" fill="#4ade80">(0.08+0.15+0.09)/3 = 0.107</text>

  <!-- Row 4 -->
  <rect x="20"  y="268" width="120" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="148" y="268" width="104" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="260" y="268" width="260" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="528" y="268" width="164" height="36" rx="5" fill="#1e3a5f"/>
  <rect x="152" y="190" width="96" height="110" rx="4" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="80"  y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd">4</text>
  <text x="200" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#93c5fd">0.21</text>
  <text x="390" y="291" text-anchor="middle" font-size="12" fill="#93c5fd">[0.15, 0.09, 0.21] ← slid down</text>
  <text x="610" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#4ade80">(0.15+0.09+0.21)/3 = 0.150</text>

  <!-- ── Arrow showing window direction ── -->
  <line x1="200" y1="318" x2="200" y2="338" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3b82f6"/>
    </marker>
  </defs>
  <text x="200" y="356" text-anchor="middle" font-size="11" fill="#3b82f6">window slides</text>
  <text x="200" y="370" text-anchor="middle" font-size="11" fill="#3b82f6">one row at a time</text>

  <!-- ── Legend / key takeaways ── -->
  <rect x="20" y="395" width="680" height="88" rx="8" fill="#161b27" stroke="#334155" stroke-width="1"/>

  <rect x="36"  y="413" width="12" height="12" rx="2" fill="#fbbf24"/>
  <text x="54" y="424" font-size="12" fill="#e2e8f0"><tspan font-weight="bold">NaN</tspan> — window not full yet (rows 0 … window-2).  Use <tspan fill="#93c5fd">min_periods=1</tspan> to get partial means instead.</text>

  <rect x="36"  y="435" width="12" height="12" rx="2" fill="#4ade80"/>
  <text x="54" y="446" font-size="12" fill="#e2e8f0"><tspan font-weight="bold">Valid output</tspan> — first appears at row <tspan fill="#93c5fd">window - 1</tspan> (row 2 for window=3, row 49 for window=50).</text>

  <rect x="36"  y="457" width="12" height="12" rx="2" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="54" y="468" font-size="12" fill="#e2e8f0"><tspan font-weight="bold">Blue bracket</tspan> — the 3-row slice used for the current calculation.  It moves down by 1 each row.</text>

</svg>
